
<!-- ========== MAIN PEMESANAN ========== -->
<main>
    <section class="bagian" id="pesan">
        <h1>Formulir Pemesanan Sasirangan</h1>

        <p>
            Silakan isi formulir berikut untuk memesan produk
            Sasirangan Banua. Kolom bertanda
            <strong>*</strong> wajib diisi.
        </p>

        <form id="form-pesan" class="form-pesan" action="#" method="get">

            <div class="kolom">
                <label for="nama">Nama lengkap *</label>
                <input type="text" id="nama" name="nama"
                    required minlength="3" autocomplete="name">
            </div>

            <div class="kolom">
                <label for="wa">Nomor WhatsApp *</label>
                <input type="tel" id="wa" name="wa"
                    required pattern="08[0-9]{8,11}"
                    placeholder="Contoh: 081234567890"
                    autocomplete="tel">
            </div>

            <div class="kolom">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email"
                    autocomplete="email">
            </div>

            <div class="kolom">
                <label for="produk">Produk yang dipesan *</label>
                <select id="produk" name="produk" required>
                    <option value="">-- Pilih produk --</option>
                    <option>Kain Motif Gigi Haruan</option>
                    <option>Kain Motif Kambang Kacang</option>
                    <option>Selendang Iris Pudak</option>
                    <option>Kemeja Bayam Raja</option>
                    <option>Tas Naga Balimbur</option>
                    <option>Gamis Ombak Sinapur Karang</option>
                </select>
            </div>

            <div class="kolom">
                <label for="bahan">Pilihan bahan *</label>
                <select id="bahan" name="bahan" required>
                    <option value="">-- Pilih bahan --</option>
                    <option>Katun</option>
                    <option>Rayon</option>
                    <option>Sutra</option>
                </select>
            </div>

            <div class="kolom">
                <label for="jumlah">Jumlah pesanan *</label>
                <input type="number" id="jumlah" name="jumlah"
                    min="1" max="50" value="1" required>
            </div>

            <fieldset>
                <legend>Metode pengambilan *</legend>

                <label>
                    <input type="radio" name="pengambilan"
                        value="Ambil di galeri" checked>
                    Ambil di galeri
                </label>

                <label>
                    <input type="radio" name="pengambilan"
                        value="Dikirim ke alamat">
                    Dikirim ke alamat
                </label>
            </fieldset>

            <div class="kolom">
                <label for="alamat">Alamat pengiriman</label>
                <textarea id="alamat" name="alamat"
                    rows="3" maxlength="300"
                    placeholder="Masukkan alamat lengkap jika memilih pengiriman"></textarea>
            </div>

            <div class="kolom">
                <label for="catatan">Catatan tambahan</label>
                <textarea id="catatan" name="catatan"
                    rows="4" maxlength="300"
                    placeholder="Contoh: warna dominan merah atau ukuran L"></textarea>
            </div>

            <label class="cek">
                <input type="checkbox" id="setuju"
                    name="setuju" required>
                Saya setuju data ini hanya digunakan
                untuk memproses pesanan. *
            </label>

            <button type="submit" class="tombol">
                Kirim Pesanan
            </button>

        </form>
    </section>
</main>
